server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kpass_261026?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root          
    password: 1234          

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        # DB 테이블/컬럼명을 자바 camelCase 그대로 유지하는 설정
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # camelCase 컬럼명을 DB에 그대로 생성하기 위한 네이밍 전략 설정
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging:
  level:
    org.hibernate.SQL: debug